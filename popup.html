<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>WA Focus</h1>
      <label class="row">
        <span class="label">
          <strong>Focus mode</strong>
          <small>Hide the chat list and the icon rail</small>
        </span>
        <input id="toggle" type="checkbox" role="switch" />
      </label>
      <p class="hint">
        Works on WhatsApp Web. Toggle any time with <kbd id="shortcut">Ctrl+Shift+H</kbd>.
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
